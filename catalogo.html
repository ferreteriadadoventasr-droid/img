<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Catálogo de Precios</title>
<style>
:root{
  /* =====================================================
     CAMBIA AQUÍ TU PALETA (CATÁLOGO FINAL)
     ===================================================== */
  --bg:#0b1020;
  --panel: rgba(255,255,255,.06);
  --card: rgba(255,255,255,.06);
  --border: rgba(255,255,255,.12);
  --text: rgba(255,255,255,.92);
  --muted: rgba(255,255,255,.70);
  --accent:#7c3aed;
  --accent2:#22c55e;

  --r:18px;
  --shadow:0 18px 55px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family: ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;
  color:var(--text);
  background:
    radial-gradient(900px 520px at 0% -10%, rgba(124,58,237,.25), transparent 60%),
    radial-gradient(900px 520px at 100% 0%, rgba(34,197,94,.16), transparent 60%),
    var(--bg);
}
.wrap{max-width:1200px;margin:0 auto;padding:18px}
header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px}
h1{margin:0;font-size:18px;letter-spacing:.2px}
small{color:var(--muted);line-height:1.3}
.panel{
  border:1px solid var(--border);
  background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
  border-radius: var(--r);
  box-shadow: var(--shadow);
  overflow:hidden;
}
.toolbar{
  padding:12px;border-bottom:1px solid var(--border);
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  background: rgba(0,0,0,.10);
}
input,select{
  padding:10px 12px;border-radius:12px;border:1px solid var(--border);
  background: rgba(0,0,0,.16);color:var(--text);outline:none;
}
.search{flex:1;min-width:220px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>div{min-width:170px;flex:1}
.chip{
  padding:8px 10px;border:1px solid var(--border);
  border-radius:999px;background: rgba(255,255,255,.05);
  color:var(--muted);font-size:12px;
}
.catalog{
  padding:12px;display:grid;
  grid-template-columns: repeat(4, minmax(0,1fr));
  gap:12px;
}
@media(max-width:1100px){.catalog{grid-template-columns: repeat(3, minmax(0,1fr))}}
@media(max-width:820px){.catalog{grid-template-columns: repeat(2, minmax(0,1fr))}}
@media(max-width:520px){.catalog{grid-template-columns: 1fr}}

.card{
  border:1px solid var(--border);border-radius:18px;
  background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.14));
  overflow:hidden;box-shadow: 0 10px 28px rgba(0,0,0,.25);
  display:flex;flex-direction:column;min-height: 330px;
}
.imgbox{
  height:170px;display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid var(--border);
  background: radial-gradient(520px 180px at 50% 0%, rgba(124,58,237,.20), transparent 60%),
              rgba(255,255,255,.03);
  position:relative;
}
.imgbox img{max-width:92%;max-height:92%;object-fit:contain;filter: drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.badge{
  position:absolute;top:10px;left:10px;
  padding:6px 10px;border-radius:999px;border:1px solid var(--border);
  background: rgba(0,0,0,.35);color: var(--muted);font-size:12px;
}
.nofound{
  width:92%;height:70%;border:1px dashed rgba(255,255,255,.25);
  border-radius:16px;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:6px;color: rgba(255,255,255,.70);
  background: rgba(0,0,0,.10);
}
.nofound b{color: rgba(255,255,255,.90)}
.body{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.codeLine{display:flex;justify-content:space-between;gap:10px;align-items:center}
.code{font-weight:900;font-size:13px;letter-spacing:.2px;font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.pricePill{
  font-weight:900;font-size:12px;padding:6px 10px;border-radius:999px;
  border:1px solid rgba(34,197,94,.25);background: rgba(34,197,94,.12);
  color: rgba(229,255,240,.92);
}
.desc{font-size:13px;line-height:1.25;color: rgba(255,255,255,.90);min-height: 34px}
.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.tag{padding:6px 10px;border-radius:999px;border:1px solid var(--border);background: rgba(255,255,255,.03)}
.table{margin-top:auto;border-top:1px solid var(--border);padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.rowP{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;border:1px solid rgba(255,255,255,.06);background: rgba(255,255,255,.03);color: var(--muted);font-size:12px;}
.rowP b{color: rgba(255,255,255,.90)}
.footer{padding:10px 12px;border-top:1px solid var(--border);color: var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background: rgba(0,0,0,.10);}
.mono{font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
</head><body>

<header>

const $ = (id)=>document.getElementById(id);
function b64DecodeUnicode(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
const PAYLOAD = JSON.parse(b64DecodeUnicode(DATA_B64));
function fmtMoney(n){
  const curr = PAYLOAD.meta.curr || "$";
  const dec = Number(PAYLOAD.meta.dec || 2);
  if(!Number.isFinite(n)) return "—";
  return curr + " " + n.toFixed(dec);
}
function imgUrl(code){
  return `${encodeURIComponent(code)}.png`;
}

function mainPrice(p){
  const A = p.prices.find(x=>String(x.lista).toUpperCase()==="A" && Number.isFinite(x.precio));
  if(A) return A.precio;
  const any = p.prices.find(x=>Number.isFinite(x.precio));
  return any ? any.precio : NaN;
}
function esc(s){
  return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function fillFilters(products){
  const groups = Array.from(new Set(products.map(p=>p.grupo||"").filter(Boolean))).sort((a,b)=>a.localeCompare(b));
  const g = $("g");
  for(const x of groups){ const o=document.createElement("option"); o.value=x; o.textContent=x; g.appendChild(o); }
  const setL = new Set();
  for(const p of products) for(const pr of p.prices) setL.add(String(pr.lista));
  const lists = Array.from(setL).sort((a,b)=>a.localeCompare(b));
  const l = $("l");
  for(const x of lists){ const o=document.createElement("option"); o.value=x; o.textContent=x; l.appendChild(o); }
}
function selectedLists(){
  const sel=$("l"); const out=[];
  for(const opt of sel.options) if(opt.selected) out.push(opt.value);
  return out;
}
function inRange(code, desde, hasta){
  if(desde && code < desde) return false;
  if(hasta && code > hasta) return false;
  return true;
}
function render(){
  const q = ($("q").value||"").trim().toLowerCase();
  const g = ($("g").value||"").trim();
  const d = ($("d").value||"").trim();
  const h = ($("h").value||"").trim();
  const lists = selectedLists();
  let items = PAYLOAD.products || [];
  items = items.filter(p=>{
    if(q){
      const ok = (p.code||"").toLowerCase().includes(q) || (p.desc||"").toLowerCase().includes(q);
      if(!ok) return false;
    }
    if(g && (p.grupo||"") !== g) return false;
    if((d||h) && !inRange(p.code||"", d, h)) return false;
    if(lists.length){
      const has = p.prices.some(x=>lists.includes(String(x.lista)));
      if(!has) return false;
    }
    return true;
  });
  $("chipCount").textContent = items.length + " productos";
  const setL = new Set();
  for(const p of items) for(const pr of p.prices) setL.add(String(pr.lista));
  $("chipLists").textContent = setL.size + " listas";
  const el = $("catalog"); el.innerHTML="";
  for(const p of items){
    const card=document.createElement("div"); card.className="card";
    const imgbox=document.createElement("div"); imgbox.className="imgbox";
    imgbox.innerHTML = '<span class="badge">'+esc(p.grupo||"Sin grupo")+'</span>';
    const img=new Image(); img.src=imgUrl(p.code); img.alt=p.code; img.loading="lazy";
    img.onerror = ()=>{
      imgbox.innerHTML = '<span class="badge">'+esc(p.grupo||"Sin grupo")+'</span>' +
        '<div class="nofound"><div style="font-size:22px">🖼️</div><b>NO FOUND</b>' +
        '<div class="mono" style="font-size:11px;opacity:.9">'+esc(p.code)+'</div></div>';
    };
    img.onload = ()=> imgbox.appendChild(img);
    const body=document.createElement("div"); body.className="body";
    body.innerHTML =
      '<div class="codeLine"><span class="code">'+esc(p.code)+'</span>' +
      '<span class="pricePill">'+esc(fmtMoney(mainPrice(p)))+'</span></div>' +
      '<div class="desc">'+esc(p.desc||"")+'</div>' +
      '<div class="meta"><span class="tag">Unidad: <b>'+esc(p.und||"—")+'</b></span></div>';
    const table=document.createElement("div"); table.className="table";
    for(const pr of (p.prices||[])){
      const row=document.createElement("div"); row.className="rowP";
      row.innerHTML = '<span>Lista <b>'+esc(String(pr.lista))+'</b></span>' +
                      '<span class="mono">'+esc(fmtMoney(pr.precio))+'</span>';
      table.appendChild(row);
    }
    card.appendChild(imgbox); card.appendChild(body); card.appendChild(table);
    el.appendChild(card);
  }
}
$("stamp").textContent = new Date().toLocaleString();
fillFilters(PAYLOAD.products || []);
["q","g","d","h","l"].forEach(id => $(id).addEventListener(id==="q" ? "input" : "change", render));
render();
</script>
</body></html>
